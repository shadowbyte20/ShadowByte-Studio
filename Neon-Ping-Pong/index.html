<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neon Ping Pong X — Power Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#02030d;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:12px}
.wrap{width:min(780px,100%)}
h1{text-align:center;margin:4px 0 8px;text-shadow:0 0 18px #8b5cf6}
.stats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.stat{background:#090d25dd;border:1px solid #6045a8;border-radius:12px;padding:7px 10px;font-weight:bold}
.arena{position:relative;height:min(70vh,560px);min-height:420px;overflow:hidden;border:2px solid #6846c7;border-radius:22px;background:radial-gradient(circle at 25% 25%,#632cff55,transparent 22%),radial-gradient(circle at 78% 70%,#00d9ff44,transparent 25%),radial-gradient(circle at 50% 45%,#25105f,#09051d 45%,#02030d);box-shadow:0 0 35px #5b21b688,inset 0 0 100px #000;touch-action:none}
.arena:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 2px),radial-gradient(circle,#8be9ff 1px,transparent 2px),radial-gradient(circle,#d8b4fe 1px,transparent 2px);background-size:73px 73px,127px 127px,191px 191px;animation:stars 18s linear infinite;opacity:.65}
#posterScreen{position:absolute;inset:0;z-index:50;background:#02030d;display:flex;align-items:center;justify-content:center}
#posterScreen img{width:100%;height:100%;object-fit:cover;display:block}
#posterScreen button{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:14px 30px;border:2px solid #22d3ee;border-radius:15px;background:#080b20ee;color:#fff;font-size:20px;font-weight:bold;box-shadow:0 0 25px #22d3ee;cursor:pointer}
.planet{position:absolute;right:20px;top:60px;font-size:82px;opacity:.4;filter:drop-shadow(0 0 20px #8b5cf6);animation:float 5s ease-in-out infinite}
.nebula{position:absolute;width:240px;height:240px;border-radius:50%;left:-90px;bottom:20px;background:#b026ff33;filter:blur(45px)}
.net{position:absolute;left:0;right:0;top:50%;border-top:2px dashed #ffffff35}
.paddle{position:absolute;width:108px;height:16px;border-radius:12px;z-index:5}
.ai{top:22px;background:linear-gradient(90deg,#ff2bd6,#fff,#ff2bd6);box-shadow:0 0 18px #ff2bd6}
.player{bottom:22px;background:linear-gradient(90deg,#16d9ff,#fff,#16d9ff);box-shadow:0 0 18px #16d9ff}
.ball{position:absolute;width:30px;height:30px;border-radius:50%;z-index:8;background:radial-gradient(circle at 28% 22%,#fff 0 8%,#dffcff 18%,#42e4ff 42%,#237cff 68%,#07163d);box-shadow:0 0 10px #fff,0 0 28px #35dfff,0 0 60px #168bff;animation:spin .3s linear infinite;pointer-events:none}
.ball.fire{background:radial-gradient(circle at 30% 25%,#fff 0 8%,#fff3a3 20%,#ff8a00 48%,#ff1f1f 72%,#470000);box-shadow:0 0 12px #fff,0 0 30px #ff9d00,0 0 65px #ff2800}
.target{position:absolute;width:40px;height:40px;border:3px solid #ffd21f;border-radius:50%;z-index:6;display:grid;place-items:center;box-shadow:0 0 18px #ffd21f}
.power{position:absolute;width:42px;height:42px;border-radius:50%;z-index:7;display:grid;place-items:center;font-size:23px;font-weight:bold;border:2px solid #fff;box-shadow:0 0 20px currentColor;animation:pulse .8s infinite;pointer-events:none}
.powerLabel{position:absolute;top:44px;font-size:8px;white-space:nowrap;text-shadow:0 0 6px #000}
.shieldFX{position:absolute;inset:0;border:4px solid #22d3ee;border-radius:20px;box-shadow:inset 0 0 30px #22d3ee;pointer-events:none;z-index:4;display:none}
.bar{height:9px;background:#15182b;border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a855f7,#22d3ee);transition:width:.2s}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.controls button{border:1px solid #6555a9;background:#0c1025;color:#fff;border-radius:12px;padding:11px 15px;font-weight:bold;cursor:pointer}
.controls button:active{transform:scale(.95)}
.status{text-align:center;color:#c8c8e8;margin:7px;font-size:14px;min-height:18px}
.powerStatus{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;min-height:28px}
.badge{background:#101532;border:1px solid #5260a8;border-radius:10px;padding:4px 7px;font-size:11px}
.legend{font-size:11px;text-align:center;color:#9fa7c9;margin-top:5px}
@keyframes stars{to{background-position:0 500px,0 800px,0 1000px}}
@keyframes float{50%{transform:translateY(18px) rotate(5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.15)}}
@media(max-width:520px){.arena{min-height:400px;height:65vh}.paddle{width:100px}.controls button{padding:10px 11px;font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🌌 NEON PING PONG X — POWER EDITION</h1>
<div class="stats">
<div class="stat">YOU <span id="s">0</span></div>
<div class="stat">AI <span id="a">0</span></div>
<div class="stat">❤️ <span id="l">3</span></div>
<div class="stat">🔥 <span id="c">0</span>x</div>
<div class="stat">LV <span id="v">1</span></div>
</div>

<div class="arena" id="arena">
<div id="posterScreen">
<img src="neon-ping-pong-play-now.jpg" alt="Neon Ping Pong X Poster" onerror="this.style.display='none'">
<button onclick="startGameFromPoster()">▶ PLAY NOW</button>
</div>
<div class="planet">🪐</div><div class="nebula"></div><div class="net"></div>
<div class="target" id="target">🎯</div>
<div class="shieldFX" id="shieldFX"></div>
<div class="paddle ai" id="ai"></div>
<div class="paddle player" id="player"></div>
</div>

<div class="bar"><i id="ult"></i></div>
<div class="powerStatus" id="powerStatus"></div>
<div class="controls">
<button id="left">◀ LEFT</button>
<button id="right">RIGHT ▶</button>
<button id="ultimate">⚡ ULTIMATE</button>
<button id="start">🚀 START</button>
</div>
<div class="status" id="status">Collect the neon power-ups!</div>
<div class="legend">⚡ Speed · 🧊 Slow · 🔵 Multi · 🛡️ Shield · 🧲 Magnet · 💥 Smash · ❤️ Life · 🔥 Fire · ❄️ Freeze</div>
</div>

<script>
const $=id=>document.getElementById(id);
const ar=$("arena"),p=$("player"),ai=$("ai"),tg=$("target"),ult=$("ult");
let px=0,ax=0,score=0,as=0,lives=3,combo=0,level=1,charge=0,run=false,last=0,raf;
const PW=108;
let balls=[], power=null, powerTimer=0, spawnTimer=0;
let effects={speed:false,slow:false,shield:false,magnet:false,smash:false,fire:false,freeze:false};

const powerTypes=[
 {type:"speed",icon:"⚡",name:"SPEED BOOST",color:"#22d3ee"},
 {type:"slow",icon:"🧊",name:"SLOW BALL",color:"#60a5fa"},
 {type:"multi",icon:"🔵",name:"MULTI-BALL",color:"#a78bfa"},
 {type:"shield",icon:"🛡️",name:"SHIELD",color:"#22d3ee"},
 {type:"magnet",icon:"🧲",name:"MAGNET",color:"#f472b6"},
 {type:"smash",icon:"💥",name:"SMASH",color:"#f97316"},
 {type:"life",icon:"❤️",name:"EXTRA LIFE",color:"#fb7185"},
 {type:"fire",icon:"🔥",name:"FIRE BALL",color:"#ff7a00"},
 {type:"freeze",icon:"❄️",name:"FREEZE AI",color:"#93c5fd"}
];

function cl(x,a,z){return Math.max(a,Math.min(z,x))}
function setP(x){px=cl(x,0,ar.clientWidth-(effects.magnet?145:PW));p.style.left=px+"px"}
function ballSpeedFactor(){
 let f=1;
 if(effects.speed)f*=1.5;
 if(effects.slow)f*=.55;
 return f;
}
function makeBall(x,y,vx,vy){
 return {x,y,vx,vy,el:null,dead:false,fire:effects.fire};
}
function createBall(){
 let speed=(230+level*14);
 return makeBall(ar.clientWidth/2-15,ar.clientHeight/2,(Math.random()<.5?-1:1)*speed,(Math.random()<.5?-1:1)*(250+level*14));
}
function resetBalls(){
 document.querySelectorAll(".ball").forEach(e=>e.remove());
 balls=[createBall()];
 spawnTimer=0;
}
function renderBall(ball){
 if(!ball.el){
  ball.el=document.createElement("div");ball.el.className="ball";ar.appendChild(ball.el);
 }
 ball.el.classList.toggle("fire",!!ball.fire);
 ball.el.style.left=ball.x+"px";ball.el.style.top=ball.y+"px";
}
function removeBall(ball){
 if(ball.el)ball.el.remove();
 ball.dead=true;
}
function moveTarget(){
 tg.style.left=Math.random()*(ar.clientWidth-45)+"px";
 tg.style.top=90+Math.random()*(ar.clientHeight-180)+"px";
}
function add(n){
 score+=n;$("s").textContent=score;
 charge=cl(charge+n*2,0,100);ult.style.width=charge+"%";
 level=1+Math.floor(score/10);$("v").textContent=level;
}
function resetEffects(){
 Object.keys(effects).forEach(k=>effects[k]=false);
 power=null;powerTimer=0;
 $("shieldFX").style.display="none";
 p.style.width=PW+"px";
 document.querySelectorAll(".power").forEach(e=>e.remove());
 document.querySelectorAll(".ball").forEach(e=>e.classList.remove("fire"));
 updatePowerStatus();
}
function reset(){
 score=0;as=0;combo=0;lives=3;level=1;charge=0;
 $("s").textContent=0;$("a").textContent=0;$("l").textContent=3;$("c").textContent=0;$("v").textContent=1;ult.style.width="0%";
 setP((ar.clientWidth-PW)/2);ax=px;moveTarget();resetEffects();resetBalls();
}
function start(){
 cancelAnimationFrame(raf);reset();run=true;$("status").textContent="🌌 POWER MATCH STARTED!";
 last=performance.now();raf=requestAnimationFrame(loop);
}
function startGameFromPoster(){$("posterScreen").style.display="none";start()}

function ultimate(){
 if(charge<100||!run)return;
 charge=0;ult.style.width="0%";add(10);combo+=3;$("c").textContent=combo;
 effects.smash=true;
 $("status").textContent="⚡ COSMIC ULTIMATE +10 — SMASH READY!";
 setTimeout(()=>effects.smash=false,8000);
}
function updatePowerStatus(){
 const names=[];
 powerTypes.forEach(x=>{if(effects[x.type])names.push(`<span class="badge">${x.icon} ${x.name}</span>`)});
 $("powerStatus").innerHTML=names.join("");
}
function spawnPower(){
 if(power||!run)return;
 const data=powerTypes[Math.floor(Math.random()*powerTypes.length)];
 const el=document.createElement("div");el.className="power";el.textContent=data.icon;
 el.style.color=data.color;el.style.left=Math.random()*(ar.clientWidth-55)+10+"px";
 el.style.top=100+Math.random()*(ar.clientHeight-220)+"px";
 el.title=data.name;
 const label=document.createElement("span");label.className="powerLabel";label.textContent=data.name;el.appendChild(label);
 ar.appendChild(el);
 power={data,el,x:parseFloat(el.style.left),y:parseFloat(el.style.top)};
}
function collectPower(){
 if(!power)return;
 const t=power.data.type;
 power.el.remove();power=null;
 if(t==="speed"){effects.speed=true;effects.slow=false;setTimeout(()=>{effects.speed=false;updatePowerStatus()},5000)}
 if(t==="slow"){effects.slow=true;effects.speed=false;setTimeout(()=>{effects.slow=false;updatePowerStatus()},5000)}
 if(t==="multi"){
  const base=balls.find(x=>!x.dead)||createBall();
  balls.push(makeBall(base.x,base.y,-base.vx*.85,base.vy*.95),makeBall(base.x,base.y,base.vx*.8,-base.vy*.9));
 }
 if(t==="shield"){effects.shield=true;$("shieldFX").style.display="block"}
 if(t==="magnet"){effects.magnet=true;p.style.width="145px";setTimeout(()=>{effects.magnet=false;p.style.width=PW+"px";updatePowerStatus()},7000)}
 if(t==="smash"){effects.smash=true;setTimeout(()=>effects.smash=false,8000)}
 if(t==="life"){lives++;$("l").textContent=lives}
 if(t==="fire"){effects.fire=true;balls.forEach(x=>x.fire=true);setTimeout(()=>{effects.fire=false;balls.forEach(x=>x.fire=false);updatePowerStatus()},7000)}
 if(t==="freeze"){effects.freeze=true;setTimeout(()=>{effects.freeze=false;updatePowerStatus()},6000)}
 updatePowerStatus();
 $("status").textContent=dataMessage(t);
}
function dataMessage(t){
 return ({speed:"⚡ SPEED BOOST ACTIVATED!",slow:"🧊 BALL SLOWED!",multi:"🔵 MULTI-BALL ACTIVATED!",shield:"🛡️ SHIELD ONLINE!",magnet:"🧲 MAGNET PADDLE!",smash:"💥 SMASH READY!",life:"❤️ EXTRA LIFE!",fire:"🔥 FIRE BALL!",freeze:"❄️ AI FROZEN!"})[t];
}
function powerCollision(ball){
 if(!power||!power.el)return;
 const cx=power.x+21,cy=power.y+21;
 if(Math.hypot(ball.x+15-cx,ball.y+15-cy)<36)collectPower();
}
function hitPlayer(ball,py,pw){
 if(ball.vy>0&&ball.y+30>=py&&ball.y<py+30&&ball.x+30>px&&ball.x<px+pw){
  ball.y=py-30;
  let h=(ball.x+15-(px+pw/2))/(pw/2);
  let mult=effects.smash?1.9:1.025;
  ball.vy=-Math.abs(ball.vy)*mult;
  ball.vx=cl(ball.vx+h*(effects.smash?360:180),-900,900);
  if(effects.smash){effects.smash=false;$("status").textContent="💥 SMASH HIT!";add(3)}
  combo++;$("c").textContent=combo;add(1);
  return true;
 }
 return false;
}
function hitAI(ball){
 if(ball.vy<0&&ball.y<48&&ball.x+30>ax&&ball.x<ax+PW){
  ball.y=48;ball.vy=Math.abs(ball.vy)*(effects.fire?1.08:1.02);as++;$("a").textContent=as;
 }
}
function missPlayer(ball){
 if(ball.y>ar.clientHeight+5){
  if(effects.shield){
   effects.shield=false;$("shieldFX").style.display="none";ball.y=ar.clientHeight-70;ball.vy=-Math.abs(ball.vy);$("status").textContent="🛡️ SHIELD SAVED YOU!";updatePowerStatus();return false;
  }
  removeBall(ball);lives--;$("l").textContent=lives;combo=0;$("c").textContent=0;
  if(lives<=0){run=false;$("status").textContent="🏁 GAME OVER — SCORE "+score;return true}
  if(balls.every(x=>x.dead)){balls=[createBall()]}
  return true;
 }
 return false;
}
function loop(t){
 if(!run)return;
 let dt=Math.min(.03,(t-last)/1000);last=t;
 const factor=ballSpeedFactor();
 const pw=effects.magnet?145:PW;
 balls.forEach(ball=>{
  if(ball.dead)return;
  ball.x+=ball.vx*factor*dt;ball.y+=ball.vy*factor*dt;
  if(ball.x<0){ball.x=0;ball.vx=Math.abs(ball.vx)}
  if(ball.x>ar.clientWidth-30){ball.x=ar.clientWidth-30;ball.vx=-Math.abs(ball.vx)}
  hitPlayer(ball,ar.clientHeight-38,pw);hitAI(ball);
  const tx=parseFloat(tg.style.left),ty=parseFloat(tg.style.top);
  if(Math.hypot(ball.x+15-(tx+20),ball.y+15-(ty+20))<35){
   add(5);combo++;$("c").textContent=combo;$("status").textContent="🎯 TARGET HIT! +5";moveTarget();
  }
  powerCollision(ball);
  if(missPlayer(ball))return;
  if(ball.y<-35){add(3);combo++;$("c").textContent=combo;$("status").textContent="🔥 POINT!";removeBall(ball)}
  renderBall(ball);
 });
 balls=balls.filter(x=>!x.dead);
 if(!balls.length&&run)balls=[createBall()];
 const aiSpeed=effects.freeze?.45:1;
 ax+=(balls[0]?balls[0].x-PW/2+15-ax:0)*Math.min(1,dt*(2+level*.12)*aiSpeed);
 ai.style.left=cl(ax,0,ar.clientWidth-PW)+"px";
 spawnTimer+=dt;
 if(spawnTimer>4.5){spawnTimer=0;if(!power&&Math.random()<.85)spawnPower()}
 raf=requestAnimationFrame(loop);
}
$("left").onclick=()=>setP(px-70);
$("right").onclick=()=>setP(px+70);
$("start").onclick=start;
$("ultimate").onclick=ultimate;
ar.addEventListener("pointermove",e=>{
 if(!run)return;
 const r=ar.getBoundingClientRect();setP(e.clientX-r.left-(effects.magnet?72:PW/2));
});
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")setP(px-55);
 if(e.key==="ArrowRight")setP(px+55);
 if(e.code==="Space")ultimate();
});
window.addEventListener("resize",()=>setP(px));
reset();
</script>
</body>
</html>
