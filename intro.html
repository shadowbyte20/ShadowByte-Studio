<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShadowByte Studio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Full-screen responsive video */
    #introVideo {
      position: fixed;
      top: 50%;
      left: 50%;

      width: 100vw;
      height: 100vh;

      transform: translate(-50%, -50%);

      object-fit: cover;
      object-position: center;

      background: #000;
      display: block;
    }

    /* Phone */
    @media (max-width: 600px) {
      #introVideo {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }

    /* Tablet */
    @media (min-width: 601px) and (max-width: 1200px) {
      #introVideo {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }

    /* Laptop / Desktop */
    @media (min-width: 1201px) {
      #introVideo {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }
  </style>
</head>

<body>

  <video
    id="introVideo"
    autoplay
    muted
    playsinline
    preload="auto">

    <source src="shadowbyte-opening-FullHD.mp4" type="video/mp4">

  </video>

  <script>
    const video = document.getElementById("introVideo");

    /*
      Automatically open your main website
      after the intro video finishes.
    */
    video.addEventListener("ended", function () {
      window.location.href = "index.html";
    });

    /*
      Try autoplay when the page loads.
    */
    window.addEventListener("load", function () {
      video.play().catch(() => {
        console.log("Autoplay was blocked by the browser.");
      });
    });
  </script>

</body>
</html>
