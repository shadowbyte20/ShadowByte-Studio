<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShadowByte Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#introVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

#fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
    z-index: 10;
}

#fade.active {
    opacity: 1;
}
</style>
</head>

<body>

<video id="introVideo" autoplay muted playsinline preload="auto">
    <source src="shadowbyte-opening.mp4" type="video/mp4">
</video>

<div id="fade"></div>

<script>

const video = document.getElementById("introVideo");
const fade = document.getElementById("fade");

function openWebsite() {

    fade.classList.add("active");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1500);
}

video.addEventListener("ended", openWebsite);

</script>

</body>
</html>
