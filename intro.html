<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowByte Studio — Opening</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#introVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
}

/* Dark cinematic overlay */
.overlay {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center,
        rgba(0, 110, 255, 0.10),
        rgba(0, 0, 0, 0.72));
    z-index: 2;
}

/* Play screen */
#startScreen {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(
        135deg,
        #02030a,
        #00152e,
        #000000
    );
    transition: opacity 0.8s ease;
}

.logo {
    font-size: clamp(34px, 8vw, 75px);
    font-weight: 900;
    letter-spacing: 5px;
    color: white;
    text-shadow:
        0 0 10px #008cff,
        0 0 25px #008cff,
        0 0 50px #0066ff;
    margin-bottom: 12px;
}

.tagline {
    color: #a9cfff;
    font-size: clamp(12px, 3vw, 18px);
    letter-spacing: 4px;
    margin-bottom: 40px;
}

/* Professional play button */
#playButton {
    position: relative;
    padding: 17px 42px;
    border: 2px solid #008cff;
    border-radius: 50px;
    background: rgba(0, 110, 255, 0.12);
    color: white;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        0 0 12px #008cff,
        inset 0 0 12px rgba(0, 140, 255, 0.2);
    transition: 0.3s ease;
}

#playButton:hover {
    background: #008cff;
    box-shadow:
        0 0 20px #008cff,
        0 0 50px #0066ff;
    transform: scale(1.05);
}

#playButton:active {
    transform: scale(0.97);
}

.hint {
    margin-top: 18px;
    color: #71839b;
    font-size: 12px;
    letter-spacing: 1px;
}

/* Fade transition */
#fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    transition: opacity 1.5s ease;
}

#fade.active {
    opacity: 1;
}

/* Loading text */
#loading {
    display: none;
    margin-top: 20px;
    color: #5eb7ff;
    font-size: 13px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<!-- Your opening video -->
<video id="introVideo"

    </div>

    <div id="loading">
        LOADING EXPERIENCE...
    </div>

</div>

<!-- Fade to website -->
<div id="fade"></div>
